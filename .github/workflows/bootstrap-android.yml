name: Bootstrap Android Changes

on:
  push:
    branches:
      - codex/android-app
    paths:
      - sullyos-android-no-workflows.patch
      - .github/workflows/bootstrap-android.yml

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Apply reviewed Android source patch
        run: git apply --index sullyos-android-no-workflows.patch

      - name: Commit Android source changes
        run: |
          git commit -m "feat(android): add installable app and release updates"
          git push origin HEAD:codex/android-app
